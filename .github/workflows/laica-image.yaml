name: Laica Image

# Builds the Laica fork into a container image and pushes it to GHCR.
# Upstream publishes twentycrm/twenty from its own pipeline; that image carries
# no Laica code, so the Laica servers need this one instead.
#
# Release a new image:
#   git tag v2.43.0-laica.1 && git push origin v2.43.0-laica.1
# Result:
#   ghcr.io/admin-laicadev/twenty:2.43.0-laica.1
#   ghcr.io/admin-laicadev/twenty:sha-<short-sha>
#
# The version is the upstream release this fork is built on, plus a '-laica.N'
# suffix that counts the Laica builds on top of it. So the tag says both where
# the code came from and that it is ours.
#
# Tags only, never a branch push and never a floating tag: the compose files in
# laica-stack pin an exact image, so what runs is always traceable to a commit.
# The pattern cannot collide with upstream's tags, which are namespaced
# ('twenty/v*', 'sdk/v*', 'ui/v*').

on:
  push:
    tags:
      - 'v*-laica.*'

permissions:
  contents: read
  packages: write

concurrency:
  group: laica-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive image version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/twenty-docker/twenty/Dockerfile
          # 'twenty' is the same target upstream ships; 'twenty-aws' and the
          # dev targets are not wanted here.
          target: twenty
          # The Laica servers are amd64. Building arm64 too would double the
          # build time for nothing.
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/admin-laicadev/twenty:${{ steps.version.outputs.value }}
            ghcr.io/admin-laicadev/twenty:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo
            echo '```'
            echo "ghcr.io/admin-laicadev/twenty:${{ steps.version.outputs.value }}"
            echo "ghcr.io/admin-laicadev/twenty:sha-${{ github.sha }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
